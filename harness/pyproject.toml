[project]
name = "party-line-harness"
version = "0.2.0"
description = "Run LLM personas on your own machine and dial them into a party line server"
requires-python = ">=3.12"
dependencies = [
    "websockets>=14,<16",
    "pyyaml>=6",
    "httpx>=0.27",
]

[project.optional-dependencies]
# inference on Apple Silicon; FakeEngine needs none of this
mlx = ["mlx-lm>=0.24"]

[project.scripts]
party-line-harness = "party_line_harness.main:cli"

[dependency-groups]
dev = ["pytest>=8", "pytest-asyncio>=0.24"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/party_line_harness"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
